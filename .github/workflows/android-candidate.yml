name: Android Candidate

run-name: Candidate ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    tags:
      - 'candidate-*'

concurrency:
  group: android-candidate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Require Android project
        shell: bash
        run: |
          if [ ! -f settings.gradle.kts ]; then
            echo "This ref does not contain the Android project." >&2
            exit 1
          fi

      - name: Test, lint and assemble release candidate
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleRelease

      - name: Upload release candidate APK
        uses: actions/upload-artifact@v4
        with:
          name: gymup-v1-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

