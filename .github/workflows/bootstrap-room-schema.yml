name: Bootstrap Room Schema

on:
  push:
    branches:
      - 'tech/issue-4-room-seed'

permissions:
  contents: write

jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Room schema
        run: ./gradlew --no-daemon kspDebugKotlin

      - name: Commit generated schema when changed
        shell: bash
        run: |
          git add app/schemas
          if git diff --cached --quiet; then
            echo "Room schema already tracked."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: export Room schema v1 [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
