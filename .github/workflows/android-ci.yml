name: Android CI

on:
  push:
    branches:
      - main
      - 'tech/**'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Check whether Android project exists
        id: android-project
        shell: bash
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Android project has not been bootstrapped on this ref yet."
          fi

      - name: Unit tests
        if: steps.android-project.outputs.exists == 'true'
        run: gradle --no-daemon testDebugUnitTest

      - name: Lint
        if: steps.android-project.outputs.exists == 'true'
        run: gradle --no-daemon lintDebug

      - name: Assemble debug APK
        if: steps.android-project.outputs.exists == 'true'
        run: gradle --no-daemon assembleDebug

      - name: Assemble release APK
        if: steps.android-project.outputs.exists == 'true'
        run: gradle --no-daemon assembleRelease

      - name: Upload debug APK
        if: steps.android-project.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gymup-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        if: steps.android-project.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gymup-v1-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
